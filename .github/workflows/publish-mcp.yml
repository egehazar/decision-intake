name: Publish to MCP Registry
# Lists the hosted connector (server.json) in the official MCP Registry when a version tag is pushed.
# GitHub OIDC proves the io.github.egehazar namespace: no secret to store. The publisher binary is pinned and
# its Sigstore signature verified, as the registry's documentation recommends.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC for the registry login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: The listed endpoint answers MCP before it is published
        run: |
          set -euo pipefail
          url=$(python3 -c "import json; print(json.load(open('server.json'))['remotes'][0]['url'])")
          curl -sf --max-time 30 -X POST "$url" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 -c "import json,sys; t=json.load(sys.stdin)['result']['tools']; assert t, 'no tools'; print('tools:', [x['name'] for x in t])"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Confirm the listing
        run: |
          curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.egehazar/decision-intake" \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['servers']; print('listed:', len(s), 'record(s)'); assert s"
