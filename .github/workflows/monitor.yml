name: monitor
# The live service, every 30 minutes and after every push to master: the page, health, a real screening step,
# a whole screening, the deployed model and rules against this repository, and the MCP connector in both
# protocol eras. A failure fails the run, and GitHub emails the repository owner.
on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: https://decision-intake.vercel.app
    steps:
      - name: After a push, wait until Vercel serves this commit
        if: github.event_name == 'push'
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 40); do
            got=$(curl -sf --max-time 20 "$BASE/healthz" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit'))" || true)
            if [ "$got" = "$want" ]; then echo "live: $got"; exit 0; fi
            echo "waiting: live $got, pushed $want"; sleep 15
          done
          echo "commit $want is not live after 10 minutes (the build may have failed)"; exit 1
      - name: Screener page
        run: curl -sf --max-time 20 -o /dev/null "$BASE/" && echo "page ok"
      - name: Framing - refused everywhere but /embed (D47)
        run: |
          curl -sfI --max-time 20 "$BASE/" | grep -i '^content-security-policy:' | grep -q "frame-ancestors 'none'" && echo "/ refuses framing"
          curl -sfI --max-time 20 "$BASE/docs.html" | grep -i '^content-security-policy:' | grep -q "frame-ancestors 'none'" && echo "/docs.html refuses framing"
          curl -sfI --max-time 20 "$BASE/embed" | grep -i '^content-security-policy:' | grep -q "frame-ancestors https:" && echo "/embed allows https sites"
          curl -sf --max-time 20 "$BASE/embed.js" | grep -q "decisionintake:height" && echo "embed.js served"
      - name: Health, with the rules loaded
        run: |
          curl -sf --max-time 20 "$BASE/healthz" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] and d['rules'], d; print('healthz', d['version'], '|', d['rules'], '| commit', d.get('commit'), '| bundle', d.get('bundle_sha256'))"
      - name: A screening step
        run: |
          curl -sf --max-time 30 -X POST "$BASE/v1/step" -H 'Content-Type: application/json' \
            -d '{"facts":[{"question":"state","choice":"TX"},{"question":"children","choice":"2"}]}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['next']['action']=='ask', r; print('step ok, next:', r['next']['question']['id'])"
      - uses: actions/checkout@v5
      - name: The deployment serves this repository's model and rules
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          h = json.load(urllib.request.urlopen(os.environ["BASE"] + "/healthz", timeout=20))
          bundle = hashlib.sha256(open("bundles/benefits_v3.npz", "rb").read()).hexdigest()[:12]
          rules = json.dumps(json.load(open("bundles/guards_2026.json", encoding="utf-8")), sort_keys=True, separators=(",", ":"))
          rules = hashlib.sha256(rules.encode()).hexdigest()[:12]
          assert (h["bundle_sha256"], h["rules_sha256"]) == (bundle, rules), (h, bundle, rules)
          print("deployed", h["commit"], "serves bundle", bundle, "and rules", rules, "from", os.environ["GITHUB_SHA"][:7])
          PY
      - name: A whole screening, answered to the end
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["BASE"]
          answers = {"state": "PA", "household_size": "4", "children": "2", "child_under5": "yes", "infant_or_pregnant": "no",
                     "senior": "no", "disabled": "no", "married": "yes", "self_employed": "no", "employer_insurance": "no",
                     "college": "no", "tenure": "rent", "earned_income": "$30,000 to $40,000", "social_security": "none",
                     "other_income": "none", "housing_cost": "$1,000 to $1,500", "childcare": "$3,000 to $8,000",
                     "assets": "under $2,000"}
          def step(state, facts):
              req = urllib.request.Request(base + "/v1/step", data=json.dumps({"state": state, "facts": facts}).encode(),
                                           headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=30))
          r, n = step(None, []), 0
          while r["next"]["action"] == "ask" and n < 20:
              q = r["next"]["question"]["id"]
              r, n = step(r["state"], [{"question": q, "choice": answers[q]}]), n + 1
          nxt = r["next"]
          assert nxt["action"] in ("finish", "hand_off"), nxt["action"]
          ids = {x["id"] for x in nxt["recommend"]}
          assert {"snap", "medicaid"} <= ids, ids  # a family of four on $35k: SNAP and Medicaid are in every run
          print(f"finished after {n} questions: {sorted(ids)}")
          PY
      - name: MCP, handshake era (2025-11-25)
        run: |
          curl -sf --max-time 30 -X POST "$BASE/mcp" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 -c "import json,sys; t=json.load(sys.stdin)['result']['tools']; assert len(t)==4, t; print('mcp tools:', [x['name'] for x in t])"
      - name: MCP, stateless era (2026-07-28)
        run: |
          curl -sf --max-time 30 -X POST "$BASE/mcp" -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: server/discover' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; assert r['resultType']=='complete' and '2026-07-28' in r['supportedVersions'], r; print('discover ok:', r['supportedVersions'])"
