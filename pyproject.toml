[project]
name = "decisionintake"
version = "1.1.0"
description = "A decision engine for US benefits screening: what to ask next, when to stop, and when it can't tell."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ege Hazar"}]
requires-python = ">=3.11"
keywords = ["benefits screening", "value of information", "mcp", "policyengine", "decision theory"]

dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://decision-intake.vercel.app"
Documentation = "https://decision-intake.vercel.app/docs.html"
Source = "https://github.com/egehazar/decision-intake"
Issues = "https://github.com/egehazar/decision-intake/issues"

[project.scripts]
decisionintake-web = "decisionintake.web:main"
decisionintake-mcp = "decisionintake.mcp_server:main"

[project.optional-dependencies]
benefits = ["policyengine-us", "tables", "pandas"]
dev = ["pytest"]

# Run from a clone (pip install -e .): the model, rules and screener live in bundles/ and public/ beside src/.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
