[project]
name = "decisionintake"
version = "0.2.0"
description = "Tells an AI assistant what to ask next, which answers to trust, and when it knows enough to act or should hand off."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
benefits = ["policyengine-us", "tables", "pandas"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
